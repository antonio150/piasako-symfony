
services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: piasako_php
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      database:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: piasako_nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  database:
    image: mysql:8.0
    container_name: piasako_database
    environment:
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
